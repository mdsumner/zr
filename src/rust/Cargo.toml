[package]
name = "zr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]
name = "zr"

[features]
default = ["local"]
local = []
remote = ["dep:zarrs_object_store", "dep:object_store", "dep:tokio"]

[dependencies]
extendr-api = "0.8"
zarrs = { version = "0.23", features = ["ndarray", "filesystem", "gzip", "blosc", "zstd", "sharding"] }
serde_json = "1"

# Remote store deps — only compiled with --features remote
# Uses object_store for both HTTP and S3 (via async-to-sync adapter)
# No zarrs_http — it pulls in reqwest with native-tls/openssl
zarrs_object_store = { version = "0.6", optional = true }
object_store = { version = "0.13", default-features = false, features = ["http", "aws"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
